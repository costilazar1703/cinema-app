<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Rezervare Loc - Cinema</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #0a0a0a;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ECRAN CINEMA */
        .screen {
            width: 80%;
            height: 10px;
            background: #555;
            margin: 20px 0 50px 0;
            box-shadow: 0 5px 15px rgba(255, 123, 0, 0.5);
            border-radius: 50%;
            text-align: center;
        }

        /* GRID LOCURI */
        #locuri {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 12px;
            width: 90%;
            max-width: 800px;
            margin-bottom: 30px;
        }

        .seat-card {
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .seat-card:hover:not(.ocupat) {
            border-color: #ff7b00;
            transform: scale(1.05);
        }

        .seat-card.selected {
            background: #ff7b00;
            color: #000;
            font-weight: bold;
            border-color: #fff;
        }

        .seat-card.ocupat {
            background: #440000;
            border-color: #770000;
            color: #888;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="navbar" style="width: 100%;"><h2>Cinema <span>City</span></h2></div>

<h1 class="page-title">Alege un loc</h1>

<div class="screen">ECRAN</div>

<div class="legend">
    <span><small>⬛</small> Liber</span>
    <span><small style="color:#ff7b00">⬛</small> Selectat</span>
    <span><small style="color:#440000">⬛</small> Ocupat</span>
</div>

<div id="locuri"></div>

<div class="actions">
    <button id="btnRezerva" class="btn" style="padding: 15px 40px; font-size: 18px;">Confirmă Rezervarea</button>
    <button id="btnInapoi" class="btn" style="background: #444; color: white;">Înapoi</button>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const id_film_sala = params.get("id_film_sala");
    
    // Recuperare ID client din URL sau memorie
    let id_client = params.get("id_client") || localStorage.getItem("id_client");

    if (!id_client) {
        alert("Trebuie să fii logat pentru a rezerva!");
        window.location.href = "login.html";
    } else {
        localStorage.setItem("id_client", id_client);
    }

    let locSelectat = null;

    // 1. Încarcă locurile pentru configurația specifică Film-Sală
    async function loadLocuri() {
        try {
            const res = await fetch(`/api/locuri_film/${id_film_sala}`);
            const locuri = await res.json();
            const grid = document.getElementById('locuri');

            grid.innerHTML = locuri.map(l => `
                <div class="seat-card ${l.Ocupat ? 'ocupat' : ''}" data-id="${l.Id_loc}">
                    R${l.Rand} L${l.Numar}
                </div>
            `).join("");

            // Click pentru selectare
            document.querySelectorAll('.seat-card:not(.ocupat)').forEach(seat => {
                seat.addEventListener('click', () => {
                    if (locSelectat) locSelectat.classList.remove('selected');
                    seat.classList.add('selected');
                    locSelectat = seat;
                });
            });
        } catch (err) {
            console.error("Eroare la încărcare locuri:", err);
        }
    }

    // 2. Acțiune Rezervare
    document.getElementById('btnRezerva').addEventListener('click', async () => {
        if (!locSelectat) {
            return alert("Te rugăm să alegi un loc în sală!");
        }

        const id_loc = locSelectat.dataset.id;

        try {
            const res = await fetch('/api/rezerva', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    id_client: parseInt(id_client), 
                    id_film_sala: parseInt(id_film_sala), 
                    id_loc: parseInt(id_loc) 
                })
            });

            const data = await res.json();

            if (data.success) {
                alert(`Succes! Rezervarea cu numărul ${data.id_rezervare} a fost înregistrată.`);
                window.location.href = `rezervarile_mele.html?id_client=${id_client}`;
            } else {
                alert("Eroare: " + (data.error || "Nu s-a putut finaliza rezervarea."));
            }
        } catch (err) {
            alert("Eroare de comunicare cu serverul.");
        }
    });

    // 3. Buton Înapoi
    document.getElementById('btnInapoi').addEventListener('click', () => {
        window.history.back();
    });

    loadLocuri();
</script>

</body>
</html>
